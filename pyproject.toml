[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synergy-finder"
version = "0.1.0"
description = "Rule-based MTG card synergy finder built on Scryfall oracle text."
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
synergy-finder = "synergy_finder.cli:main"

[tool.setuptools.packages.find]
include = ["synergy_finder*"]

[tool.setuptools.package-data]
"synergy_finder.web" = ["static/*.html", "static/*.js", "static/*.css"]
